<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — RightOnQ</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0B1524;
      --blue: #2F6FD2;
      --blue-light: #4A8AE8;
      --white: #FFFFFF;
      --grey: #8A9BB5;
      --grey-light: #1A2A40;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 21, 36, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(47, 111, 210, 0.15);
    }
    .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
    .logo-svg { width: 44px; height: 44px; flex-shrink: 0; }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--white);
      letter-spacing: 0.06em;
    }
    .logo-text span { color: var(--blue); }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a.blog-link {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--grey);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a.blog-link:hover { color: var(--white); }
    nav a.cta-nav {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--white);
      text-decoration: none;
      padding: 10px 24px;
      border: 1px solid rgba(47, 111, 210, 0.5);
      border-radius: 6px;
      transition: all 0.2s;
    }
    nav a.cta-nav:hover { background: var(--blue); border-color: var(--blue); }
    .content-wrap { max-width: 800px; margin: 0 auto; padding: 140px 60px 80px; }
    footer {
      padding: 40px 60px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .footer-logo { display: flex; align-items: center; gap: 10px; }
    .footer-logo svg { width: 32px; height: 32px; }
    .footer-left { font-size: 13px; color: rgba(255,255,255,0.25); line-height: 1.8; }
    .footer-right { font-size: 13px; color: rgba(255,255,255,0.25); }
    .footer-right a { color: #4A8AE8; font-size: 13px; text-decoration: none; transition: color 0.2s; }
    .footer-right a:hover { color: #fff; }
    @media (max-width: 768px) {
      nav { padding: 20px 24px; }
      .content-wrap { padding: 100px 24px 60px; }
      footer { padding: 32px 24px; flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">
      <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RightOnQ logo">
        <rect x="8" y="18" width="84" height="76" rx="14" ry="14" fill="white"/>
        <rect x="28" y="8" width="12" height="22" rx="6" ry="6" fill="#0B1524"/>
        <rect x="60" y="8" width="12" height="22" rx="6" ry="6" fill="#0B1524"/>
        <text x="50" y="42" font-family="Arial Black, sans-serif" font-weight="900" font-size="16" fill="#0B1524" text-anchor="middle" letter-spacing="1">ON</text>
        <text x="50" y="88" font-family="Arial Black, sans-serif" font-weight="900" font-size="58" fill="#2F6FD2" text-anchor="middle">Q</text>
      </svg>
      <span class="logo-text">RIGHT<span>ON</span>Q<span style="font-size:0.5em;vertical-align:super;color:var(--blue);">&#8482;</span></span>
    </a>
    <div class="nav-links">
      <a href="/blog" class="blog-link">Blog</a>
      <a href="/#contact" class="cta-nav">Get in touch</a>
    </div>
  </nav>
  <main class="content-wrap">
    {{ content }}
  </main>
  <footer>
    <div class="footer-logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RightOnQ logo">
        <rect x="8" y="18" width="84" height="76" rx="14" ry="14" fill="white" opacity="0.9"/>
        <rect x="28" y="8" width="12" height="22" rx="6" ry="6" fill="#0B1524"/>
        <rect x="60" y="8" width="12" height="22" rx="6" ry="6" fill="#0B1524"/>
        <text x="50" y="42" font-family="Arial Black, sans-serif" font-weight="900" font-size="16" fill="#0B1524" text-anchor="middle" letter-spacing="1">ON</text>
        <text x="50" y="88" font-family="Arial Black, sans-serif" font-weight="900" font-size="58" fill="#2F6FD2" text-anchor="middle">Q</text>
      </svg>
      <div class="footer-left">
        &copy; 2026 Continuity AI Ltd. Registered in England &amp; Wales.<br>
        Clay Bank Farmhouse, Hook Norton, BANBURY, OX15 5PA &middot; Companies House No. 17119848
      </div>
    </div>
    <div class="footer-right">
      RightOnQ is a trading name of Continuity AI Ltd.<br>
      <a href="/">Home</a> &nbsp;&middot;&nbsp;
      <a href="/blog">Blog</a> &nbsp;&middot;&nbsp;
      <a href="/privacy">Privacy Policy</a> &nbsp;&middot;&nbsp;
      <a href="/terms">Terms &amp; Conditions</a>
    </div>
  </footer>
</body>
</html>
