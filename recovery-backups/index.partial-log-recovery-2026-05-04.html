<style>
  :root {
    --navy: #101a2a;
    --navy-deep: #0c1420;
    --panel: #18263a;
    --panel-soft: #20324a;
    --blue: #3478d8;
    --blue-light: #67a6ff;
    --gold: #d6b65a;
    --green: #35b978;
    --white: #f7fbff;
    --grey: #a9b7ca;
    --grey-light: #1f3047;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 20px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(11, 21, 36, 0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(47, 111, 210, 0.15);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
  }

  .logo-svg { width: 44px; height: 44px; flex-shrink: 0; }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--white);
    letter-spacing: 0.06em;
  }

  .logo-text span { color: var(--blue); }

  nav a.cta-nav {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--white);
    text-decoration: none;
    padding: 10px 24px;
    border: 1px solid rgba(47, 111, 210, 0.5);
    border-radius: 6px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  nav a.cta-nav:hover {
    background: var(--blue);
    border-color: var(--blue);
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 120px 60px 80px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -200px; right: -200px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(47,111,210,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -100px; left: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(47,111,210,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--blue-light);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.2s;
  }

  .hero-tag::before {
    content: '';
    width: 24px; height: 1px;
    background: var(--blue);
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(48px, 7vw, 96px);
    line-height: 1.0;
    letter-spacing: 0;
    max-width: 900px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.4s;
  }

  h1 em { font-style: normal; color: var(--blue); }

  .hero-sub {
    margin-top: 32px;
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 300;
    color: var(--grey);
    max-width: 580px;
    line-height: 1.7;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.6s;
  }
  .tm-mark {
    font-size: 0.48em;
    font-weight: 500;
    vertical-align: super;
    margin-left: 0.08em;
    color: var(--blue-light);
    letter-spacing: 0;
  }

  .hero-actions {
    margin-top: 48px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.8s;
  }

  .btn-primary {
    padding: 16px 36px;
    background: var(--blue);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 6px;
    transition: all 0.2s;
    border: none;
    cursor: pointer;
  }

  .btn-primary:hover {
    background: var(--blue-light);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(47,111,210,0.4);
  }

  .btn-secondary {
    font-size: 15px;
    font-weight: 400;
    color: var(--grey);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s;
  }

  .btn-secondary:hover { color: var(--white); }
  .btn-secondary::after { content: '→'; transition: transform 0.2s; }
  .btn-secondary:hover::after { transform: translateX(4px); }

  /* TICKER */
  .ticker {
    margin-top: 80px;
    padding: 24px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 1s;
  }

  .ticker-inner {
    display: flex;
    gap: 60px;
    animation: ticker 22s linear infinite;
    width: max-content;
  }

  .ticker-item {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .ticker-item::after {
    content: '◆';
    color: var(--blue);
    font-size: 8px;
  }

  @keyframes ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* WHAT WE DO */
  .what {
    padding: 120px 60px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
  }

  .what-left h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;

    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
  }

  .what-left h2 em { font-style: normal; color: var(--blue); }

  .what-left p {
    font-size: 17px;
    color: var(--grey);
    line-height: 1.8;
    margin-bottom: 16px;
  }

  .what-right { display: grid; gap: 16px; }

  .card {
    background: var(--grey-light);
    border: 1px solid rgba(47,111,210,0.15);
    border-radius: 12px;
    padding: 28px 32px;
    transition: border-color 0.2s, transform 0.2s;
  }

  .card:hover {
    border-color: rgba(47,111,210,0.5);
    transform: translateX(4px);
  }

  .card-num {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: rgba(47, 111, 210, 0.6);
    margin-bottom: 12px;
  }

  .card h3 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .card p { font-size: 14px; color: var(--grey); line-height: 1.7; }

  /* CONTACT */
  .contact {
    padding: 120px 60px;
    background: var(--grey-light);
    border-top: 1px solid rgba(47,111,210,0.15);
  }

  .contact-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: start;
  }

  .contact h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(36px, 4vw, 56px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
  }

  .contact h2 em { font-style: normal; color: var(--blue); }

  .contact > .contact-inner > div > p {
    font-size: 17px;
    color: var(--grey);
    line-height: 1.8;
    margin-bottom: 40px;
  }

  .contact-details { display: grid; gap: 24px; }

  .contact-item { display: flex; flex-direction: column; gap: 4px; }

  .contact-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--blue);
  }

  .contact-value { font-size: 16px; color: var(--white); font-weight: 400; }
  .contact-value a { color: var(--white); text-decoration: none; transition: color 0.2s; }
  .contact-value a:hover { color: var(--blue-light); }

  /* FORM */
  .contact-form { display: grid; gap: 16px; }

  .form-group { display: flex; flex-direction: column; gap: 8px; }

  .form-group label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--grey);
  }

  .form-group input,
  .form-group textarea {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 14px 18px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
  }

  .form-group input:focus,
  .form-group textarea:focus { border-color: var(--blue); }

  .form-group input::placeholder,
  .form-group textarea::placeholder { color: rgba(255,255,255,0.2); }

  .form-submit { margin-top: 8px; }

  /* FOOTER */
  footer {
    padding: 40px 60px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .footer-logo { display: flex; align-items: center; gap: 10px; }
  .footer-logo svg { width: 32px; height: 32px; }

  .footer-left { font-size: 13px; color: rgba(255,255,255,0.25); line-height: 1.8; }
  .footer-right { font-size: 13px; color: rgba(255,255,255,0.25); }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    nav {
      padding: 16px 20px;
      flex-direction: column;
      gap: 14px;
    }
    nav > div {
      gap: 16px !important;
    }
    .logo-text { font-size: 18px; }
    .logo-svg { width: 38px; height: 38px; }
    nav a.cta-nav { padding: 8px 18px; font-size: 13px; }

    .contact { padding: 80px 24px; }
    .contact-inner { grid-template-columns: 1fr; gap: 48px; }
    footer { padding: 32px 24px; flex-direction: column; align-items: flex-start; }
  }

<!-- FAQ -->
<section class="faq-section">
  <div class="section-inner">
    <div class="section-tag">Good to know</div>
    <h2 class="section-heading">RCS <em>questions.</em></h2>
    <div class="faq-list">

      <details>
        <summary>Do recipients need to install anything?</summary>
        <p>No. RCS arrives in the phone's native messaging app on supported devices. If RCS is not available, the essential message can fall back to SMS.</p>
      </details>

      <details>
        <summary>Is RightOnQ GDPR-compliant?</summary>
        <p>Yes. We’re a UK company and process data under UK GDPR. We only store the contact details you provide and the message logs needed for delivery and audit.</p>
      </details>

      <details>
        <summary>Can messages include reply buttons?</summary>
        <p>Yes. Rich RCS cards can include up to four buttons, and carousel cards usually support one or two buttons per card. That means your audience can choose a clear next step with one tap, without typing a reply.</p>
      </details>

      <details>
        <summary>What happens when RCS is not available?</summary>
        <p>The message can fall back to SMS so the recipient still receives the essential information. Rich RCS elements such as images, carousels and buttons may not appear in the SMS version, and fallback SMS is charged at the applicable fallback message rate.</p>
      </details>

      <details>
        <summary>Do you handle RCS registration?</summary>
        <p>We can help, but it is not automatic. RCS registration needs business details, sender profile information, logo and banner assets, contact details, privacy and terms links, example messages, opt-in/opt-out information and approval checks. Some of that has to come from you. If you want us to hand-hold the process, we charge for the staff time involved, with managed onboarding available from around £500.</p>
      </details>

    </div>
  </div>
</section>

<script>
  // Form submit handler
  function handleSubmit(e) {
    e.preventDefault();
    var btn = e.target.querySelector('button[type="submit"]');
    btn.textContent = 'Sent ✓';
    btn.style.background = '#1a7a4a';
    btn.disabled = true;
  }

  // Scroll reveal
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1';
        entry.target.style.transform = 'translateY(0)';
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.card, .step, .scenario-card, .feature-item, .quote-panel, .registration-panel').forEach(function(el) {
    el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
    observer.observe(el);
  });

  // Dynamic footer year
  document.getElementById('footer-year').textContent = new Date().getFullYear();

  // Header scroll opacity
  var header = document.querySelector('nav');
  if (header) {
    window.addEventListener('scroll', function() {
      if (window.scrollY > 20) {
        header.style.background = 'rgb(16, 26, 42)';
      } else {
        header.style.background = 'rgba(16, 26, 42, 0.88)';
      }
    }, { passive: true });
  }
  // Cookie consent
  (function() {
    var KEY = 'rightonq_consent';
    var banner = document.getElementById('cookie-banner');
    var stored = localStorage.getItem(KEY);
    if (stored === 'granted') {
      gtag('consent', 'update', { analytics_storage: 'granted' });
    } else if (!stored) {
      banner.hidden = false;
    }
    banner.addEventListener('click', function(e) {
      var choice = e.target.dataset.consent;
      if (!choice) return;
      localStorage.setItem(KEY, choice);
      gtag('consent', 'update', { analytics_storage: choice });
      banner.hidden = true;
    });
  })();
</script>
